<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 16" width="1200" height="16" role="img" aria-label="divider">
  <defs>
    <linearGradient id="rb" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="300" y2="0" spreadMethod="repeat">
      <stop offset="0"    stop-color="#ff004d"/>
      <stop offset="0.17" stop-color="#ff9a00"/>
      <stop offset="0.34" stop-color="#f9f900"/>
      <stop offset="0.5"  stop-color="#37ff00"/>
      <stop offset="0.67" stop-color="#00e5ff"/>
      <stop offset="0.84" stop-color="#8a2be2"/>
      <stop offset="1"    stop-color="#ff004d"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="300 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect x="0" y="5" width="1200" height="6" rx="3" fill="url(#rb)"/>
</svg>
