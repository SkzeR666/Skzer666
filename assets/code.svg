  <text x="26" y="978" xml:space="preserve"><tspan class="pl">      &lt;</tspan><tspan class="tag">section</tspan><tspan class="pl"> id=</tspan><tspan class="s">"projetos"</tspan><tspan class="pl">&gt;</tspan></text>
  <text x="26" y="1003" xml:space="preserve"><tspan class="pl">        {projetos.map(({ nome, sobre }) =&gt; (</tspan></text>
