  <text x="26" y="378" xml:space="preserve"><tspan class="pl">  { nome: </tspan><tspan class="rb">"OrçaZap"</tspan><tspan class="pl">, sobre: </tspan><tspan class="s">"orçamento direto no pix"</tspan><tspan class="pl"> },</tspan></text>
