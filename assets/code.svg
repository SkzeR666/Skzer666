  <text x="26" y="1303" xml:space="preserve"><tspan class="pl">        ))}</tspan></text>
  <text x="26" y="1328" xml:space="preserve"><tspan class="pl">      &lt;/</tspan><tspan class="tag">section</tspan><tspan class="pl">&gt;</tspan></text>
  <text x="26" y="1378" xml:space="preserve"><tspan class="pl">      &lt;</tspan><tspan class="tag">footer</tspan><tspan class="pl">&gt;</tspan></text>
  <text x="26" y="1403" xml:space="preserve"><tspan class="pl">        {Object.entries(contato).map(([rede, href]) =&gt; (</tspan></text>
