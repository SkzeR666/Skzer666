  <text x="26" y="78" xml:space="preserve"><tspan class="k">import</tspan><tspan class="pl"> </tspan><tspan class="k">type</tspan><tspan class="pl"> { </tspan><tspan class="ty">Metadata</tspan><tspan class="pl"> } </tspan><tspan class="k">from</tspan><tspan class="pl"> </tspan><tspan class="s">"next"</tspan><tspan class="pl">;</tspan></text>
