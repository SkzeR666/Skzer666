  <text x="26" y="1053" xml:space="preserve"><tspan class="pl">            &lt;</tspan><tspan class="tag">strong</tspan><tspan class="pl">&gt;{nome}&lt;/</tspan><tspan class="tag">strong</tspan><tspan class="pl">&gt; — {sobre}</tspan></text>
