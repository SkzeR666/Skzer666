  <text x="26" y="553" xml:space="preserve"><tspan class="pl">  backend: [</tspan><tspan class="s">"Node.js"</tspan><tspan class="pl">, </tspan><tspan class="s">"Go"</tspan><tspan class="pl">],</tspan></text>
  <text x="26" y="578" xml:space="preserve"><tspan class="pl">  dados: [</tspan><tspan class="s">"PostgreSQL"</tspan><tspan class="pl">, </tspan><tspan class="s">"Redis"</tspan><tspan class="pl">],</tspan></text>
