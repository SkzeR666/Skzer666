  <text x="26" y="1203" xml:space="preserve"><tspan class="pl">        {Object.entries(stack).map(([area, techs]) =&gt; (</tspan></text>
  <text x="26" y="1228" xml:space="preserve"><tspan class="pl">          &lt;</tspan><tspan class="tag">p</tspan><tspan class="pl"> key={area}&gt;</tspan></text>
